name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANILIST_CLIENT_ID: '53903'
      ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
      MAL_CLIENT_ID: '7391d69229188a5c8050c264539f8403'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Validate OAuth secret is configured
        run: test -n "$ANILIST_CLIENT_SECRET"
      - name: Build and test
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: anime-slime-debug
          path: app/build/outputs/apk/debug/*.apk
